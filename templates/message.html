{% extends "base.html" %}
{% block header %}📝 Nachricht{% endblock %}
{% block content %}
<a class="back-link" href="/">&larr; Zurück</a>

<form method="post" action="/ui/message" class="card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

  <label for="title">Titel (optional)</label>
  <input type="text" id="title" name="title" placeholder="z.B. Erinnerung">

  <label for="text">Nachricht</label>
  <textarea id="text" name="text" placeholder="Freier Text..."></textarea>

  <button type="submit">Drucken</button>
</form>
{% endblock %}
