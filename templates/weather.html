{% extends "base.html" %}
{% block header %}🌤️ Wetter{% endblock %}
{% block content %}
<a class="back-link" href="/">&larr; Zurück</a>

<form method="post" action="/ui/weather" class="card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

  <label for="location">Standort</label>
  <select id="location" name="location">
    {% for name in locations %}
      <option value="{{ name }}" {% if name == default_location %}selected{% endif %}>{{ name }}</option>
    {% endfor %}
  </select>
  <div class="hint">Weitere Standorte lassen sich über die Settings-API hinzufügen (Einstellungsseite folgt).</div>

  <button type="submit">🌤️ Wetter drucken</button>
</form>
{% endblock %}
