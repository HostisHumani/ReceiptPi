{% extends "base.html" %}
{% block header %}<span class="icon icon-cloud-sun" aria-hidden="true"></span> {{ t('tile.weather.name') }}{% endblock %}
{% block content %}
<a class="back-link" href="/"><span class="icon icon-arrow-left" aria-hidden="true"></span> {{ t('back_link') }}</a>

<form method="post" action="/ui/weather" class="card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

  <label for="location">{{ t('weather.location_label') }}</label>
  <select id="location" name="location">
    {% for name in locations %}
      <option value="{{ name }}" {% if name == default_location %}selected{% endif %}>{{ name }}</option>
    {% endfor %}
  </select>
  <div class="hint">{{ t('weather.hint') }}</div>

  <button type="submit">{{ t('weather.button') }}</button>
</form>
{% endblock %}
