{% extends "base.html" %}
{% block header %}<span class="icon icon-shopping-cart" aria-hidden="true"></span> {{ t('tile.shopping.name') }}{% endblock %}
{% block content %}
<a class="back-link" href="/"><span class="icon icon-arrow-left" aria-hidden="true"></span> {{ t('back_link') }}</a>

<form method="post" action="/ui/list" class="card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

  <label for="title">{{ t('shopping.title_label') }}</label>
  <input type="text" id="title" name="title" value="{{ default_title }}">

  <label for="items">{{ t('shopping.items_label') }}</label>
  <textarea id="items" name="items" placeholder="Milk&#10;Bread&#10;..."></textarea>

  <button type="submit">{{ t('shopping.button') }}</button>
</form>
{% endblock %}
