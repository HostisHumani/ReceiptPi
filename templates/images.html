{% extends "base.html" %}
{% block header %}<span class="icon icon-image" aria-hidden="true"></span> {{ t('tile.images.name') }}{% endblock %}
{% block content %}
<a class="back-link" href="/"><span class="icon icon-arrow-left" aria-hidden="true"></span> {{ t('back_link') }}</a>

<form method="post" action="/ui/images" enctype="multipart/form-data" class="card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

  <label for="image">{{ t('images.file_label') }}</label>
  <input type="file" id="image" name="image" accept="image/png, image/jpeg" required>
  <div class="hint">{{ t('images.hint') }}</div>

  <button type="submit">{{ t('images.button') }}</button>
</form>
{% endblock %}
