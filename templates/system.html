{% extends "base.html" %}
{% block header %}🖥️ System{% endblock %}
{% block content %}
<a class="back-link" href="/">&larr; Zurück</a>

<form method="post" action="/ui/system" class="card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <div class="hint" style="margin-top:0;">
    Fragt CPU/RAM/LXC-Status (Proxmox), NVMe-Speicherplatz + Docker (piNAS),
    die letzten PBS-Backups sowie verfügbare Updates per SSH ab. Kann ein
    paar Sekunden dauern.
  </div>
  <button type="submit">📊 Systembericht drucken</button>
</form>
{% endblock %}
