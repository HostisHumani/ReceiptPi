{% extends "base.html" %}
{% block header %}🖥️ {{ t('tile.system.name') }}{% endblock %}
{% block content %}
<a class="back-link" href="/">&larr; {{ t('back_link') }}</a>

<form method="post" action="/ui/system" class="card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <div class="hint" style="margin-top:0;">
    {{ t('system.hint') }}
  </div>
  <button type="submit">{{ t('system.button') }}</button>
</form>
{% endblock %}
