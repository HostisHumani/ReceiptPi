{% extends "base.html" %}
{% block header %}<span class="icon icon-clipboard-list" aria-hidden="true"></span> {{ t('lists.index.task.name') }}{% endblock %}
{% block content %}
<a class="back-link" href="/lists"><span class="icon icon-arrow-left" aria-hidden="true"></span> {{ t('back_link') }}</a>

<form method="post" action="/ui/task" class="card"
      data-draft-url="/ui/task/draft"
      data-draft-defaults='{"title": "", "description": "", "items": "", "priority": "", "due_date": ""}'
      data-draft-saved-text="{{ t('lists.draft.saved') }}"
      data-draft-discarded-text="{{ t('lists.draft.discarded') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <input type="hidden" name="draft_loaded_at" value="{{ draft_loaded_at }}">

  <label for="title">{{ t('lists.task.title_label') }}</label>
  <input type="text" id="title" name="title" value="{{ draft_title }}" placeholder="{{ t('lists.task.title_placeholder') }}">

  <label for="description">{{ t('lists.task.description_label') }}</label>
  <textarea id="description" name="description" placeholder="{{ t('lists.task.description_placeholder') }}" class="textarea-compact">{{ draft_description }}</textarea>

  <label for="items">{{ t('lists.task.items_label') }}</label>
  <textarea id="items" name="items" placeholder="{{ t('lists.todo.items_placeholder') }}">{{ draft_items }}</textarea>

  <label for="priority">{{ t('lists.task.priority_label') }}</label>
  <select id="priority" name="priority">
    <option value="" {{ "selected" if not draft_priority }}>{{ t('lists.task.priority_none') }}</option>
    <option value="low" {{ "selected" if draft_priority == "low" }}>{{ t('priority.low') }}</option>
    <option value="medium" {{ "selected" if draft_priority == "medium" }}>{{ t('priority.medium') }}</option>
    <option value="high" {{ "selected" if draft_priority == "high" }}>{{ t('priority.high') }}</option>
  </select>

  <label for="due_date">{{ t('lists.task.due_label') }}</label>
  <input type="date" id="due_date" name="due_date" value="{{ draft_due_date }}">

  <div class="form-actions">
    <button type="submit">{{ t('lists.task.button') }}</button>
    <button type="button" class="btn btn-secondary btn-discard-draft" data-confirm-text="{{ t('lists.draft.discard_confirm') }}">{{ t('lists.draft.discard') }}</button>
  </div>
  <span class="hint draft-status" aria-live="polite"></span>
</form>
{% endblock %}
{% block extra_scripts %}<script src="{{ url_for('static', filename='draft-autosave.js') }}" defer></script>{% endblock %}
