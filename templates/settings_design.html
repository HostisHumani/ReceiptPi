{% extends "base.html" %}
{% block header %}<span class="icon icon-palette" aria-hidden="true"></span> {{ t('settings.index.design.name') }}{% endblock %}
{% block content %}
<a class="back-link" href="/settings"><span class="icon icon-arrow-left" aria-hidden="true"></span> {{ t('back_link') }}</a>

<form method="post" action="/ui/settings/design" class="card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

  {% for key, name in supported_themes.items() %}
  <label class="theme-option">
    <input type="radio" name="theme" value="{{ key }}"
           {% if current_theme == key %}checked{% endif %}>
    <span class="theme-swatch" style="background:{{ {
      'forrest': '#2fae66',
      'dark-lime': '#b6ff2e',
      'frost': '#81a1c1',
      'butter-bean': '#013e37',
      'white-purple': '#460b6a',
    }[key] }};"></span>
    {{ name }}
  </label>
  {% endfor %}
  <div class="hint">{{ t('settings.design.hint') }}</div>

  <button type="submit">{{ t('settings.save') }}</button>
</form>
{% endblock %}
