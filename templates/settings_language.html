{% extends "base.html" %}
{% block header %}<span class="icon icon-globe" aria-hidden="true"></span> {{ t('settings.index.language.name') }}{% endblock %}
{% block content %}
<a class="back-link" href="/settings"><span class="icon icon-arrow-left" aria-hidden="true"></span> {{ t('back_link') }}</a>

<form method="post" action="/ui/settings/language" class="card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

  {% for code, name in supported_languages.items() %}
  <label class="checkbox-row">
    <input type="radio" name="language" value="{{ code }}"
           {% if current_language == code %}checked{% endif %}>
    {{ name }}
  </label>
  {% endfor %}
  <div class="hint">{{ t('settings.language.hint') }}</div>

  <button type="submit">{{ t('settings.save') }}</button>
</form>
{% endblock %}
