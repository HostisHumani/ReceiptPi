{% extends "base.html" %}
{% block header %}{{ t('settings.index.language.name') }}{% endblock %}
{% block content %}
<a class="back-link" href="/settings">&larr; {{ t('back_link') }}</a>

{% if message %}
<div class="card" style="margin-bottom:16px; {% if success %}color:var(--color-accent);{% else %}color:#e05a5a;{% endif %}">
  {{ message }}
</div>
{% endif %}

<form method="post" action="/ui/settings/language" class="card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

  {% for code, name in supported_languages.items() %}
  <label style="display:flex; align-items:center; gap:8px; {% if loop.first %}margin-top:0;{% endif %}">
    <input type="radio" name="language" value="{{ code }}" style="width:auto;"
           {% if current_language == code %}checked{% endif %}>
    {{ name }}
  </label>
  {% endfor %}
  <div class="hint">{{ t('settings.language.hint') }}</div>

  <button type="submit">{{ t('settings.save') }}</button>
</form>
{% endblock %}
