{% extends "base.html" %}
{% block header %}<span class="icon icon-hash" aria-hidden="true"></span> {{ t('games.index.tictactoe.name') }}{% endblock %}
{% block content %}
<a class="back-link" href="/games"><span class="icon icon-arrow-left" aria-hidden="true"></span> {{ t('back_link') }}</a>

<form method="post" action="/ui/games/tictactoe" class="card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

  <label for="rounds">{{ t('games.tictactoe.rounds_label') }}</label>
  <select id="rounds" name="rounds">
    <option value="3">3</option>
    <option value="6">6</option>
    <option value="9">9</option>
  </select>

  <button type="submit">{{ t('games.tictactoe.button') }}</button>
</form>
{% endblock %}
