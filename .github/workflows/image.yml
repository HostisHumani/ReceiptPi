name: Build image

# Builds receiptpi-<version>-arm64.img.xz from the official Raspberry Pi OS
# Lite image (deploy/image/). Started by hand, it installs the checkout.
# Called by release.yml, it installs the update package that workflow
# built (an artifact of the same run), so the image and the update hold
# the same files.
on:
  workflow_dispatch:
    inputs:
      upload_image:
        description: "Upload the image (img.xz) as an artifact, kept for 1 day"
        type: boolean
        default: false
  workflow_call:
    inputs:
      package_artifact:
        description: "Name of the artifact with receiptpi-<version>.tar.gz"
        type: string
        required: true
      version:
        description: "Version the package must hold"
        type: string
        required: true
      upload_image:
        description: "Upload the image (img.xz) as an artifact, kept for 1 day"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    # Native arm64, so the chroot runs the image's own binaries without
    # emulation.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    concurrency:
      group: image-build
      cancel-in-progress: false
    env:
      WORK: ${{ github.workspace }}/image-build
      # Empty when started by hand: build.sh then installs the checkout.
      PACKAGE: ${{ inputs.package_artifact && format('{0}/package/receiptpi-{1}.tar.gz', github.workspace, inputs.version) || '' }}
      PACKAGE_VERSION: ${{ inputs.version || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fetch the update package
        if: inputs.package_artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.package_artifact }}
          path: ${{ github.workspace }}/package

      - name: Install build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends fdisk e2fsprogs xz-utils

      - name: Fetch and verify the base image
        run: sudo --preserve-env=WORK deploy/image/build.sh fetch

      - name: Grow and mount the image
        run: sudo --preserve-env=WORK deploy/image/build.sh prepare

      - name: Install ReceiptPi in a chroot
        run: sudo --preserve-env=WORK,PACKAGE,PACKAGE_VERSION deploy/image/build.sh customize

      - name: Check the root file system
        run: sudo --preserve-env=WORK deploy/image/build.sh check

      - name: Shrink, check partitions and compress
        run: sudo --preserve-env=WORK deploy/image/build.sh finish

      - name: Record the artifact choice
        env:
          UPLOAD_IMAGE: ${{ inputs.upload_image }}
        run: |
          if [ "$UPLOAD_IMAGE" = "true" ]; then
            echo "image artifact: yes (upload_image=true)" | sudo tee -a "$WORK/summary.txt"
          else
            echo "image artifact: no (upload_image=false)" | sudo tee -a "$WORK/summary.txt"
          fi

      # Only on request: the image is larger than the artifact storage
      # included in the smaller plans.
      - name: Upload the image
        if: inputs.upload_image
        uses: actions/upload-artifact@v7
        with:
          name: receiptpi-image
          path: ${{ env.WORK }}/out/*.img.xz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Release mounts after a failure
        if: failure()
        run: sudo --preserve-env=WORK deploy/image/build.sh unmount

      - name: Summary
        if: always()
        run: sudo --preserve-env=WORK deploy/image/build.sh summary

      - name: Upload checksums, manifest and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: receiptpi-image-files
          path: |
            ${{ env.WORK }}/out/SHA256SUMS
            ${{ env.WORK }}/out/*.manifest.txt
            ${{ env.WORK }}/out/check-*.txt
            ${{ env.WORK }}/summary.txt
            ${{ env.WORK }}/logs/
          retention-days: 1
          if-no-files-found: ignore
