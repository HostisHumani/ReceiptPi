name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-and-syntax:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install ruff==0.16.1

      - name: Run Ruff
        run: ruff check --output-format=github .

      - name: Check Python syntax
        run: |
          python -m compileall \
            app.py \
            gunicorn.conf.py \
            config.example.py \
            modules \
            watchers \
            print_queue.py \
            printer.py \
            security.py \
            settings_store.py
